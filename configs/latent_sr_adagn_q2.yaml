# AdaGN LatentSR on VAE-SR (Kaggle). Same schedule / 50 epochs as concat Q2.
# First of the 2×2: does a stronger consumer of z_lr transfer the VAE-SR gain?
# Control later: same yaml with VAE-1 checkpoint + a different checkpoint_dir.

dataset: CelebA
data_dir: /kaggle/working/data/raw
hr_size: 128
lr_size: 32

vae_checkpoint: /kaggle/working/outputs/vae_sr/checkpoints/latest.pt
latent_scale: 1.0

condition_type: adagn

latent_channels: 4
latent_size: 32
base_channels: 64
channel_mult: [1, 2, 4]
num_res_blocks: 2
attention_resolutions: [16, 8]
dropout: 0.1

num_timesteps: 1000
beta_start: 0.0001
beta_end: 0.02

batch_size: 64
epochs: 50
learning_rate: 0.0002
optimizer: Adam
num_workers: 2
pin_memory: true
amp: true
validate_every: 5
checkpoint_every: 1
sample_every: 25
sample_images: 4

device: auto

checkpoint_dir: /kaggle/working/outputs/latent_sr_adagn_q2/checkpoints
sample_dir: /kaggle/working/outputs/latent_sr_adagn_q2/samples
log_dir: /kaggle/working/outputs/latent_sr_adagn_q2/logs
train_metrics_file: train_metrics.csv
val_metrics_file: val_metrics.csv

hf_checkpoint_repo: HusseinHamouda/LatentSR-checkpoints
hf_checkpoint_subdir: latent_sr_adagn_q2

seed: 42
