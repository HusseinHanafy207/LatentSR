# Matched LatentSR on the Q2 SR-aware VAE (same UNet / schedule / epochs as Phase 8).
# Only the frozen VAE changes.

dataset: CelebA
data_dir: /kaggle/working/data/raw
hr_size: 128
lr_size: 32

# Frozen VAE-SR (download from HF vae_sr/latest.pt if the workspace was wiped)
vae_checkpoint: /kaggle/working/outputs/vae_sr/checkpoints/latest.pt
latent_scale: 1.0

latent_channels: 4
latent_size: 32
base_channels: 64
channel_mult: [1, 2, 4]
num_res_blocks: 2
attention_resolutions: [16, 8]
dropout: 0.1

num_timesteps: 1000
beta_start: 0.0001
beta_end: 0.02

batch_size: 64
epochs: 50
learning_rate: 0.0002
optimizer: Adam
num_workers: 2
pin_memory: true
amp: true
validate_every: 5
checkpoint_every: 1
# Full 1000-step grids are slow; 0 disables during training
sample_every: 25
sample_images: 4

device: auto

checkpoint_dir: /kaggle/working/outputs/latent_sr_q2/checkpoints
sample_dir: /kaggle/working/outputs/latent_sr_q2/samples
log_dir: /kaggle/working/outputs/latent_sr_q2/logs
train_metrics_file: train_metrics.csv
val_metrics_file: val_metrics.csv

# Separate HF folder — does NOT overwrite Phase-8 latest.pt or vae_sr/
hf_checkpoint_repo: HusseinHamouda/LatentSR-checkpoints
hf_checkpoint_subdir: latent_sr_q2

seed: 42
