# 128×128 RGB → latent (4, 32, 32), downsample factor f=4

dataset: CelebA
# Local Colab disk for fast zip extract (~200k JPEGs). Do NOT put this on Drive.
data_dir: /content/data/raw
image_size: 128
in_channels: 3

# Training (Colab T4-friendly defaults)
batch_size: 64
epochs: 50
learning_rate: 0.0001
optimizer: Adam
# Colab free/T4 VMs typically have ~2 CPUs — more workers slows things down
num_workers: 2
pin_memory: true
amp: true
validate_every: 5

# Model (64 base is enough for Phase 1 on T4; raise later if needed)
latent_channels: 4
base_channels: 64
channel_mult: [1, 2, 4]
num_res_blocks: 2
dropout: 0.0

# Loss: MSE + kl_weight * KL (mean-reduced; start small)
kl_weight: 0.0001

# Phase 2+: scale applied after encode / before decode for diffusion
# z_scaled = latent_scale * mu; decode(z_scaled / latent_scale)
latent_scale: 1.0

# Device
device: auto

# Saving (Google Drive on Colab)
checkpoint_dir: /content/drive/MyDrive/LatentSR/outputs/vae/checkpoints
sample_dir: /content/drive/MyDrive/LatentSR/outputs/vae/samples
log_dir: /content/drive/MyDrive/LatentSR/outputs/vae/logs
train_metrics_file: train_metrics.csv
val_metrics_file: val_metrics.csv
reconstruct_every: 5
# Numbered snapshots every N epochs; latest.pt is still written every epoch
checkpoint_every: 5

seed: 42
