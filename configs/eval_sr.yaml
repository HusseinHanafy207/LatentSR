# LatentSR vs bicubic evaluation on CelebA val

dataset: CelebA
data_dir: /kaggle/working/data/raw
hr_size: 128
lr_size: 32
latent_scale: 1.0

# How many val images to score (full 1000-step sampling each — keep modest)
num_images: 64
# Batch size no longer affects reverse-diffusion noise (seeded per val_index).
batch_size: 4
num_workers: 2
pin_memory: true

output_dir: /kaggle/working/outputs/eval
device: auto
# Same seed + first 64 val images for every paired VAE-1 vs VAE-SR run.
seed: 42
