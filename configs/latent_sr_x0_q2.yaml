# x0-prediction LatentSR on frozen VAE-SR (Q2 backbone).
# Matched to configs/latent_sr_q2.yaml except prediction_type: x0.
# UNet outputs z0_hat; converted to eps for the existing ||eps_hat - eps||^2 loss.

dataset: CelebA
data_dir: /kaggle/working/data/raw
hr_size: 128
lr_size: 32

# Frozen VAE-SR
vae_checkpoint: /kaggle/working/outputs/vae_sr/checkpoints/latest.pt
latent_scale: 1.0

# Direct x0 / z0 parameterization (ε-matched loss)
prediction_type: x0

latent_channels: 4
latent_size: 32
base_channels: 64
channel_mult: [1, 2, 4]
num_res_blocks: 2
attention_resolutions: [16, 8]
dropout: 0.1

num_timesteps: 1000
beta_start: 0.0001
beta_end: 0.02

batch_size: 64
epochs: 50
learning_rate: 0.0002
optimizer: Adam
num_workers: 2
pin_memory: true
amp: true
validate_every: 5
checkpoint_every: 1
sample_every: 25
sample_images: 4

device: auto

checkpoint_dir: /kaggle/working/outputs/latent_sr_x0_q2/checkpoints
sample_dir: /kaggle/working/outputs/latent_sr_x0_q2/samples
log_dir: /kaggle/working/outputs/latent_sr_x0_q2/logs
train_metrics_file: train_metrics.csv
val_metrics_file: val_metrics.csv

hf_checkpoint_repo: HusseinHamouda/LatentSR-checkpoints
hf_checkpoint_subdir: latent_sr_x0_q2
# Upload latest.pt + epoch snapshot + CSV logs after every epoch (needs HF_TOKEN).
hf_upload_every: 1

seed: 42
